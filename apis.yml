name: DEFCON AI
description: 'DEFCON AI is a modeling, simulation, and analysis (MS&A) company based
  in McLean, Virginia, building AI-driven optimization for contested logistics and
  mobility across defense and commercial operations. Founded in 2022, it develops
  mission-tailored optimization and intelligent-agent simulation products - including
  ARTIV (delivered to U.S. Air Force Air Mobility Command) and R-ALIGN for resilient
  multimodal logistics - that let planners rapidly generate and evaluate mission scenarios
  in dynamic, disrupted environments. The company was awarded a five-year, $115M prototype
  agreement supporting U.S. Marine Corps logistics modernization. DEFCON AI publishes
  no public API or developer platform.'
